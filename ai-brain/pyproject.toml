[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-brain"
version = "0.1.0"
description = "Cross-repo code graph of a workspace's repos, for coding agents"
requires-python = ">=3.12"
dependencies = [
  "neo4j>=5.28",
  "tree-sitter>=0.23",
  "tree-sitter-language-pack>=0.7",
  "graphql-core>=3.2",
  "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
mcp = ["mcp>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["neo4j: needs the local Neo4j from compose.yaml"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # fixture files are data
